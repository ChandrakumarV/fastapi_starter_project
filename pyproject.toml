[project]
name = "fastapi-starter-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ChandrakumarV", email = "chandrakumar252004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.3",
    "greenlet>=3.5.6",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
fastapi-starter-project = "fastapi_starter_project:main"

[tool.fastapi]
entrypoint = "main:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
